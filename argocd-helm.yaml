apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: opentelemetry-helm
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/AmirWeiser/opentelemetry-aws-eks-gitops.git
    targetRevision: main
    path: helm/opentelemetry-demo

    helm:
      valueFiles:
        - values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: opentelemetry-demo

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
