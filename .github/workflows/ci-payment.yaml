name: Payment Service CI

on:
  push:
    branches:
      - main
    paths:
      - "src/payment/**"
      - ".github/workflows/payment-ci.yml"

  pull_request:
    branches:
      - main
    paths:
      - "src/payment/**"
      - ".github/workflows/payment-ci.yml"

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/amirweiser/paymentservice
  MANIFEST_PATH: kubernetes/payment/deploy.yaml

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            ./src/payment

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.IMAGE_NAME }}:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL'

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        if: github.event_name == 'push'
        run: |
          docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Update Kubernetes manifest
        if: github.event_name == 'push'
        run: |
          sed -i \
            "s|image: 'ghcr.io/open-telemetry/demo:1.12.0-paymentservice'|image: '${{ env.IMAGE_NAME }}:${{ github.sha }}'|" \
            ${{ env.MANIFEST_PATH }}

      - name: Commit updated manifest
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add ${{ env.MANIFEST_PATH }}

          git diff --cached --quiet || \
          git commit -m "chore(payment): update image to ${{ github.sha }}"

          git push