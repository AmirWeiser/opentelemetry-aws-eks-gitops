name: Product Catalog CI

on:
  push:
    branches:
      - main
    paths:
      - "src/product-catalog/**"
      - ".github/workflows/ci-product-catalog.yaml"

  pull_request:
    branches:
      - main
    paths:
      - "src/product-catalog/**"
      - ".github/workflows/ci-product-catalog.yaml"

  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/amirweiser/product-catalog
  HELM_VALUES_PATH: helm/opentelemetry-demo/values.yaml

jobs:
  build-test-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.22"
          cache-dependency-path: src/product-catalog/go.sum

      - name: Download Go dependencies
        working-directory: src/product-catalog
        run: go mod download

      - name: Build application
        working-directory: src/product-catalog
        run: go build ./...

      - name: Run unit tests
        working-directory: src/product-catalog
        run: go test ./...

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            ./src/product-catalog

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: '${{ env.IMAGE_NAME }}:${{ github.sha }}'
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        if: github.event_name == 'push'
        run: |
          docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Install yq
        if: github.event_name == 'push'
        run: |
          sudo wget -q \
            https://github.com/mikefarah/yq/releases/download/v4.53.3/yq_linux_amd64 \
            -O /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq

      - name: Update Helm image tag
        if: github.event_name == 'push'
        env:
          NEW_TAG: ${{ github.sha }}
        run: |
          yq -i '.productCatalog.image.tag = strenv(NEW_TAG)' \
            ${{ env.HELM_VALUES_PATH }}

      - name: Commit Helm values update
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add ${{ env.HELM_VALUES_PATH }}

          if git diff --cached --quiet; then
            echo "No Helm values changes detected"
            exit 0
          fi

          git commit -m "chore(product-catalog): update image to ${{ github.sha }}"
          git push