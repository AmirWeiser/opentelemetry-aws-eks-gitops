name: Product Catalog CI

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "src/product-catalog/**"
      - ".github/workflows/ci-product-catalog.yaml"

  pull_request:
    branches:
      - main
    paths:
      - "src/product-catalog/**"
      - ".github/workflows/ci-product-catalog.yaml"

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/amirweiser/product-catalog
  MANIFEST_PATH: kubernetes/productcatalog/deploy.yaml

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.22"
          cache-dependency-path: src/product-catalog/go.sum

      - name: Download dependencies
        working-directory: src/product-catalog
        run: go mod download

      - name: Build application
        working-directory: src/product-catalog
        run: go build -o product-catalog-service .

      - name: Run unit tests
        working-directory: src/product-catalog
        run: go test ./...

  docker:
    name: Build and Publish Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            ./src/product-catalog

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        if: github.event_name == 'push'
        run: |
          docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}

  update-manifest:
    name: Update Kubernetes Manifest
    runs-on: ubuntu-latest
    needs: docker

    if: github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update image tag
        run: |
          sed -i \
            "s|image: .*|image: ${{ env.IMAGE_NAME }}:${{ github.sha }}|" \
            ${{ env.MANIFEST_PATH }}

      - name: Commit manifest change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add ${{ env.MANIFEST_PATH }}

          git diff --cached --quiet || \
          git commit -m "chore(product-catalog): update image to ${{ github.sha }}"

          git push