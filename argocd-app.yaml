apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: opentelemetry-demo
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/AmirWeiser/opentelemetry-aws-eks-gitops.git
    targetRevision: main
    path: kubernetes

  destination:
    server: https://kubernetes.default.svc
    namespace: opentelemetry-demo

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
